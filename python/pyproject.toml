[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "creditcurve"
version = "0.1.0"
description = "CDS hazard-rate curve bootstrapper (Python/NumPy/SciPy port of the C++ engine in ../cpp)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["creditcurve*"]
